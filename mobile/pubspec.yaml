name: ecocycle_mobile
description: Simple EcoCycle resident app (pickups & rewards).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
  assets:
    - .env
    - assets/images/
    - assets/images/generated/
    - assets/images/brand/
